<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Campus Marketplace</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__brand" href="../index.html">Campus Marketplace</a>
            <nav class="site-header__nav" aria-label="Main navigation">
                <a href="./marketplace.html">Marketplace</a>
                <a href="./login.html">Log in</a>
            </nav>
        </div>
    </header>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="forgot-title">
            <p class="auth-kicker">Account recovery</p>
            <h1 id="forgot-title">Reset your password.</h1>
            <p class="auth-lead">Enter your BMU email address and we will send a password-reset link if an account exists.</p>
            <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>
            <form id="forgot-password-form" class="auth-form">
                <div class="auth-field">
                    <label for="forgot-email">BMU email address</label>
                    <input id="forgot-email" type="email" autocomplete="email" placeholder="you@bmu.edu.in" required>
                </div>
                <button class="button button--primary auth-submit" type="submit">Send reset link</button>
            </form>
            <div class="auth-links"><a href="./login.html">Back to login</a></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-ui.js"></script>
    <script src="../js/forgot-password.js"></script>
</body>
</html>
